[package]
name = "opal"
version = "0.2.0"
edition = "2024"
publish = false
repository = "https://github.com/ClementTsang/opal"
authors = ["Clement Tsang <cjhtsang@uwaterloo.ca>"]
description = "opal is a simple static webapp to look up the IPA phonetics of English words, or vice versa."

[dependencies]
concat-string = "1.0.1"
console_log = { version = "0.2.0", optional = true }
indexmap = "2.14.0"
log = { version = "0.4.17", optional = true }
js-sys = "0.3.103"
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.91"
serde-wasm-bindgen = "0.6.5"
sql-js-httpvfs-rs = "0.0.2"
wasm-bindgen = { version = "0.2.126", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "Window",
    "MediaQueryList",
    "MouseEvent",
    "DomTokenList",
    "Document",
    "Element",
    "EventTarget",
    "Event",
    "Storage",
] }
yew = "0.19.3"

[features]
default = ["console_log", "log"]

[profile.release]
lto = true
opt-level = 's'
panic = "abort"
