[build]
public_url = "/"
# The post-build optimize.py step (wasm-opt / minify) rewrites the .wasm and .js
# after Trunk computes their SRI hashes, which would make the integrity checks
# fail and the app not load. Disable SRI since these are same-origin assets.
no_sri = true

[watch]
watch = [
    "src/",
    "Cargo.toml",
    "Cargo.lock",
    "index.html",
    "css/input.css",
    "tailwind.config.js",
]

[[hooks]]
stage = "pre_build"
command = "tailwindcss"
command_arguments = ["-i", "./css/input.css", "-o", "./css/tailwind.css", "-m"]
