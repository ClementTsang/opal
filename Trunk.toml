[build]
# Relative so a single build works whether served from the domain root
# (e.g. opal.cjhtsang.ca/) or a subpath (e.g. github.io/opal/). opal has no
# client-side routing, so relative asset paths always resolve correctly.
public_url = "./"

[watch]
watch = [
    "src/",
    "Cargo.toml",
    "Cargo.lock",
    "index.html",
    "css/input.css",
    "tailwind.config.js",
]

[[hooks]]
stage = "pre_build"
command = "tailwindcss"
command_arguments = ["-i", "./css/input.css", "-o", "./css/tailwind.css", "-m"]
