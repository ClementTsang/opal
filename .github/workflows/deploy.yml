name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

jobs:
  build:
    name: Build opal
    uses: ./.github/workflows/build.yml
    with:
      artifact: true
    secrets: inherit

  deploy:
    name: deploy
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
